<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" width="760" height="1010" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', 'Plex Mono', ui-monospace, Menlo, Consolas, monospace">
  <title id="t">Cerbi architecture</title>
  <desc id="d">Documents enter from a mailbox, drop folders and fleet telematics, are recorded once in a ledger, split into invoices, read by a vision-language model, identified, and checked against its business rules. In October 2026 each load was filed (96.5 percent; 51.9 percent with no person touching it), parked in Limbo waiting for paperwork (1.5 percent), or held in Purgatory for a person (1.0 percent). A person's answer re-runs the checks. Guards beside the pipeline stop runs on credential errors and cap spending.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b8b8f"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffae42"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #061012; }
    .box { fill: #0b191c; stroke: #6b8b8f; stroke-width: 1; }
    .key { fill: #0b191c; stroke: #5ff2e8; stroke-width: 1.5; }
    .warn { fill: #0b191c; stroke: #ffae42; stroke-width: 1.5; }
    .rail { fill: none; stroke: #24434c; stroke-width: 1; stroke-dasharray: 4 4; }
    .h { fill: #5ff2e8; font-size: 15px; }
    .ha { fill: #ffae42; font-size: 15px; }
    .t { fill: #e6e1d4; font-size: 12.5px; }
    .s { fill: #93aaa6; font-size: 12px; }
    .n { fill: #ffae42; font-size: 13px; }
    .ln { stroke: #6b8b8f; stroke-width: 1.2; fill: none; }
    .lb { stroke: #ffae42; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  </style>
  <rect class="bg" width="760" height="1010"/>

  <text class="h" x="24" y="34">CERBI // one document, end to end</text>
  <text class="s" x="24" y="54">October 2026: 9,064 documents, 13,735 loads</text>

  <!-- 1 intake -->
  <rect class="box" x="24" y="76" width="472" height="78"/>
  <text class="h" x="40" y="100">01 INTAKE</text>
  <text class="t" x="40" y="122">shared mailbox (Microsoft Graph) · drop folders</text>
  <text class="t" x="40" y="142">owned fleet's telematics (driver documents)</text>
  <path class="ln" d="M260 154 V178" marker-end="url(#a)"/>

  <!-- 2 ledger -->
  <rect class="box" x="24" y="180" width="472" height="78"/>
  <text class="h" x="40" y="204">02 LEDGER</text>
  <text class="t" x="40" y="226">SQLite, one row per envelope ever seen</text>
  <text class="t" x="40" y="246">unique on source key + sha256: never read twice</text>
  <path class="ln" d="M260 258 V282" marker-end="url(#a)"/>

  <!-- 3 segment -->
  <rect class="box" x="24" y="284" width="472" height="78"/>
  <text class="h" x="40" y="308">03 SEGMENT</text>
  <text class="t" x="40" y="330">small model tags each page of a long packet</text>
  <text class="t" x="40" y="350">invoice / BOL / ticket / note, then splits it</text>
  <path class="ln" d="M260 362 V386" marker-end="url(#a)"/>

  <!-- 4 extract -->
  <rect class="key" x="24" y="388" width="472" height="78"/>
  <text class="h" x="40" y="412">04 EXTRACT</text>
  <text class="t" x="40" y="434">vision-language model reads native PDF pages</text>
  <text class="t" x="40" y="454">into a fixed JSON schema: header + one row per load</text>
  <path class="ln" d="M260 466 V490" marker-end="url(#a)"/>

  <!-- 5 identify -->
  <rect class="box" x="24" y="492" width="472" height="78"/>
  <text class="h" x="40" y="516">05 IDENTIFY</text>
  <text class="t" x="40" y="538">sender rule → exact alias → fuzzy → person</text>
  <text class="t" x="40" y="558">match each load to the ERP's own load records</text>
  <path class="ln" d="M260 570 V594" marker-end="url(#a)"/>

  <!-- 6 rules -->
  <rect class="key" x="24" y="596" width="472" height="98"/>
  <text class="h" x="40" y="620">06 RULES</text>
  <text class="t" x="40" y="642">every check that can stop a load is a named rule</text>
  <text class="t" x="40" y="662">a held load carries that rule and a short reason</text>

  <!-- branches -->
  <path class="ln" d="M100 694 V748" marker-end="url(#a)"/>
  <path class="ln" d="M260 694 V748" marker-end="url(#a)"/>
  <path class="ln" d="M420 694 V748" marker-end="url(#a)"/>

  <rect class="key" x="24" y="750" width="152" height="112"/>
  <text class="h" x="38" y="774">FILED</text>
  <text class="n" x="38" y="796">13,255 · 96.5%</text>
  <text class="s" x="38" y="818">51.9% untouched</text>
  <text class="s" x="38" y="836">to load folders</text>
  <text class="s" x="38" y="854">+ ERP import</text>

  <rect class="box" x="184" y="750" width="152" height="112"/>
  <text class="h" x="198" y="774">LIMBO</text>
  <text class="n" x="198" y="796">211 · 1.5%</text>
  <text class="s" x="198" y="818">waits for its</text>
  <text class="s" x="198" y="836">paperwork, then</text>
  <text class="s" x="198" y="854">re-runs itself</text>

  <rect class="warn" x="344" y="750" width="152" height="112"/>
  <text class="ha" x="358" y="774">PURGATORY</text>
  <text class="n" x="358" y="796">134 · 1.0%</text>
  <text class="s" x="358" y="818">a person decides</text>
  <text class="s" x="358" y="836">from a short</text>
  <text class="s" x="358" y="854">stated reason</text>

  <!-- review loop -->
  <path class="ln" d="M420 862 V896" marker-end="url(#a)"/>
  <rect class="warn" x="300" y="898" width="196" height="64"/>
  <text class="ha" x="314" y="922">REVIEW APP</text>
  <text class="s" x="314" y="942">answer → Recheck (free)</text>
  <path class="lb" d="M496 930 H520 V645 H500" marker-end="url(#ac)"/>
  <text class="s" x="538" y="905" transform="rotate(-90 538 905)">re-runs the checks, no paid re-read</text>

  <!-- guards rail -->
  <rect class="rail" x="556" y="284" width="184" height="286"/>
  <text class="ha" x="570" y="308">GUARDS</text>
  <text class="s" x="570" y="332">circuit breaker:</text>
  <text class="t" x="570" y="350">401/403/404/429</text>
  <text class="t" x="570" y="368">stop the whole run</text>
  <text class="s" x="570" y="394">3 failures in a row,</text>
  <text class="s" x="570" y="412">or &gt;34% after 12: stop</text>
  <text class="s" x="570" y="438">spend caps per batch</text>
  <text class="s" x="570" y="456">and per 24 hours</text>
  <text class="s" x="570" y="482">oversize requests are</text>
  <text class="s" x="570" y="500">never sent</text>
  <text class="s" x="570" y="526">stub reader by default:</text>
  <text class="s" x="570" y="544">real reads are opt-in</text>
  <path class="ln" d="M556 427 H500" marker-end="url(#a)"/>

  <rect class="rail" x="556" y="76" width="184" height="182"/>
  <text class="ha" x="570" y="100">COST</text>
  <text class="t" x="570" y="124">batch read: about</text>
  <text class="t" x="570" y="144">half the live cost</text>
  <text class="t" x="570" y="164">72% of docs batched</text>
  <text class="s" x="570" y="190">large packets are</text>
  <text class="s" x="570" y="208">2% of documents but</text>
  <text class="s" x="570" y="226">36% of model spend</text>

  <text class="s" x="24" y="990">135 loads (1.0%) were rejected: duplicates or superseded copies, not loads.</text>
</svg>
